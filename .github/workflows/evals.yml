name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      PRICE_INPUT_PER_1M: "0.20"
      PRICE_CACHED_PER_1M: "0.02"
      PRICE_CACHE_WRITE_PER_1M: "0.25"
      PRICE_OUTPUT_PER_1M: "1.20"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pipx install poetry
      - run: poetry install --no-interaction --no-root
      - name: tools without model
        run: poetry run pytest checks/test_cancel_order.py
      - name: agent scenarios, pass^3
        run: poetry run pytest evals -v --runs 3
